# nginx proxies auth.$DOMAIN (the portal) here, and checks each request to a protected
# service against /api/authz/auth-request.
apiVersion: v1
kind: Service
metadata:
  name: authelia
  labels:
    app.kubernetes.io/name: authelia
spec:
  selector:
    app.kubernetes.io/name: authelia
  ports:
    - name: http
      port: 9091
      targetPort: http
      protocol: TCP
