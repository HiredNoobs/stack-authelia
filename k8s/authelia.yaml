# A single Authelia on a node labelled ${STACK}_authelia. Its storage is SQLite, so it can't
# run more than once. The data (2FA registrations, the notifier's file) is on a
# ${AUTHELIA_STORAGE_CLASS} volume, so it survives restarts and follows the pod to another
# labelled node. Sessions are in memory, a restart logs everyone out.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authelia
  labels:
    app.kubernetes.io/name: authelia
spec:
  serviceName: authelia
  replicas: 1
  # The volume outlives the StatefulSet, only 'purge' removes it.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: authelia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authelia
      annotations:
        checksum/config: "${AUTHELIA_CONFIG_CHECKSUM}"
    spec:
      nodeSelector:
        ${STACK}_authelia: ""
      # Authelia reads every AUTHELIA_* env var as config and won't start with ones it doesn't
      # know, e.g. the AUTHELIA_SERVICE_HOST k8s adds for the authelia Service.
      enableServiceLinks: false
      # Any non-root user works, fsGroup lets it write /data.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: authelia
          image: ${AUTHELIA_IMAGE}
          args: ["--config", "/config/configuration.yml"]
          env:
            - name: AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE
              value: /secrets/jwt-secret
            - name: AUTHELIA_SESSION_SECRET_FILE
              value: /secrets/session-secret
            # Encrypts the 2FA registrations in the database, they can't be read without it.
            - name: AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
              value: /secrets/storage-encryption-key
            - name: AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE
              value: /secrets/ldap-password
          ports:
            - name: http
              containerPort: 9091
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: authelia-config
        - name: secrets
          secret:
            secretName: authelia
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: authelia
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ${AUTHELIA_STORAGE_CLASS}
        resources:
          requests:
            storage: ${AUTHELIA_VOLUME_SIZE}
